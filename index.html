<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<meta name="description" content="Deepak Deon — Blogger, Tweep & Tech Enthusiast. Android apps, Telegram bots and tech stories from Kerala, India." />
<link rel="icon" href="data:," />
<title>Deepak Deon — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0a0a0f; --bg2:#101018; --ink:#f2f0ea; --dim:#9a97a8;
    --lime:#c8f542; --violet:#8b7bff; --pink:#ff7ad9; --line:#26262f;
    --card:#12121a;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif;overflow-x:hidden}
  ::selection{background:var(--lime);color:#0a0a0f}
  a{color:inherit;text-decoration:none}
  .mono{font-family:'JetBrains Mono',monospace}

  /* ---------- Loader ---------- */
  #loader{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:transform .8s cubic-bezier(.76,0,.24,1)}
  #loader.done{transform:translateY(-100%)}
  #loader .l-word{font-family:'Archivo',sans-serif;font-weight:900;font-size:clamp(13px,2.2vw,18px);letter-spacing:.32em;text-transform:uppercase;color:var(--dim)}
  #loader .l-pct{font-family:'Archivo',sans-serif;font-weight:900;font-size:clamp(64px,14vw,140px);line-height:1;color:var(--ink)}
  #loader .l-pct em{font-style:normal;color:var(--lime)}
  #loader .l-bar{width:min(320px,70vw);height:3px;background:var(--line);border-radius:99px;overflow:hidden}
  #loader .l-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--lime),var(--violet))}

  /* ---------- Nav ---------- */
  nav{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:18px clamp(18px,4vw,48px);mix-blend-mode:difference}
  nav .logo{font-family:'Archivo',sans-serif;font-weight:900;font-size:20px;letter-spacing:.06em}
  nav .logo span{color:var(--lime)}
  nav ul{display:flex;gap:clamp(14px,3vw,34px);list-style:none}
  nav ul a{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink);opacity:.85}
  nav ul a:hover{opacity:1;color:var(--lime)}
  @media(max-width:640px){nav ul a{font-size:11px;letter-spacing:.12em}}

  /* ---------- Hero ---------- */
  header{min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding:110px clamp(18px,6vw,72px) 40px;position:relative}

  .hello{font-family:'JetBrains Mono',monospace;color:var(--lime);font-size:clamp(14px,2vw,18px);letter-spacing:.15em;margin-bottom:14px}
  h1{font-family:'Archivo',sans-serif;font-weight:900;line-height:.94;text-transform:uppercase;font-size:clamp(52px,12.5vw,168px);letter-spacing:-.01em}
  h1 .row{display:block;overflow:hidden}
  h1 .row span{display:inline-block;transform:translateY(110%);animation:rise 1s cubic-bezier(.22,1,.36,1) forwards}
  h1 .row:nth-child(2) span{animation-delay:.12s;color:transparent;-webkit-text-stroke:2px var(--ink)}
  h1 .row:nth-child(3) span{animation-delay:.24s}
  h1 .dot{color:var(--lime);-webkit-text-stroke:0}
  h1 .row:nth-child(1) span{animation:rise 1s cubic-bezier(.22,1,.36,1) forwards, rgbShift 54s linear infinite}
  h1 .row:nth-child(3) span{animation:rise 1s cubic-bezier(.22,1,.36,1) .24s forwards, rgbShift 54s linear infinite}
  @keyframes rgbShift{0.0%{color:#ffadad}5.6%{color:#ffc9a3}11.1%{color:#ffd6a5}16.7%{color:#fdffb6}22.2%{color:#d9ed92}27.8%{color:#b5e48c}33.3%{color:#caffbf}38.9%{color:#b9fbc0}44.4%{color:#9bf6ff}50.0%{color:#99d6ea}55.6%{color:#a2d2ff}61.1%{color:#a0c4ff}66.7%{color:#bdb2ff}72.2%{color:#cdb4db}77.8%{color:#cdb4f6}83.3%{color:#ffc6ff}88.9%{color:#ffc8dd}94.4%{color:#ffb3c7}100%{color:#ffadad}})();
</script>
</body>
</html>
