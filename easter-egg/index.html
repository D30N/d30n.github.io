<!doctype html>
<html lang="ml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Easter Egg</title>
<script>try{if(localStorage.getItem('dd-theme')==='light')document.documentElement.setAttribute('data-theme','light')}catch(e){}</script>
<style>
:root{--bg:#0a0a0f;--ink:#f2f0ea;--dim:#a7a7b3;--card:#15151f;--line:#262633}
[data-theme="light"]{--bg:#f7f6f1;--ink:#17171d;--dim:#5f5f6a;--card:#ffffff;--line:#ddd9cd}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif;padding:24px 16px 48px}
main{max-width:640px;margin:0 auto;text-align:center}
h1{font-size:clamp(2rem,8vw,3.5rem);margin:32px 0 12px;color:#c8f542}
.sub{font-size:clamp(1rem,4vw,1.3rem);margin:0;opacity:.85}
.back{margin-top:24px;font-size:.95rem}
.back a{color:#4da6ff;text-decoration:underline}
.set-title{margin-top:24px;font-size:clamp(1.3rem,5vw,1.8rem)}
.quiz{margin-top:16px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.progress{display:flex;justify-content:space-between;font-size:.9rem;color:var(--dim);margin-bottom:10px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:8px}
.bar i{display:block;height:100%;background:#4da6ff;width:0;transition:width .4s ease}
.timer{display:flex;justify-content:space-between;font-size:.9rem;margin-bottom:6px}
.timer b{font-size:1.1rem;transition:color 1.5s ease}
.tbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:20px}
.tbar i{display:block;height:100%;background:#1faa53;width:100%;transition:width 1s linear,background-color 1.5s ease}
.q{font-size:1.25rem;line-height:1.5;margin:0 0 18px}
.opt{display:block;width:100%;text-align:left;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:13px 16px;margin:0 0 10px;font-size:1rem;font-family:inherit;cursor:pointer;transition:background .25s ease,transform .15s ease}
.opt:active{transform:scale(.99)}
.opt:disabled{cursor:default;opacity:1}
.opt.correct{background:#1faa53;border-color:#1faa53;color:#fff}
.opt.wrong{background:#e53935;border-color:#e53935;color:#fff}
.opt.dim{opacity:.55}
.feedback{min-height:24px;font-weight:700;margin-top:6px}
.feedback.ok{color:#1faa53}
.feedback.no{color:#e53935}
.result{text-align:center}
.result .big{font-size:3rem;font-weight:700;margin:8px 0}
.result p{color:var(--dim)}
.btn{background:#4da6ff;border:0;color:#fff;border-radius:12px;padding:13px 26px;font-size:1rem;font-family:inherit;cursor:pointer;margin-top:16px}
</style>
</head>
<body>
<main>
<h1>Congratulations!</h1>
<p class="sub">You found a hidden page</p>
<h2 class="set-title">Mollywood funny part 01</h2>
<section class="quiz" id="quiz">
<div class="progress"><span id="prog">ചോദ്യം 1 / 31</span><span id="score">സ്കോർ: 0</span></div>
<div class="bar"><i id="barfill"></i></div>
<div class="timer"><span>ശേഷിക്കുന്ന സമയം</span><b id="tsec">15s</b></div>
<div class="tbar"><i id="tbarfill"></i></div>
<p class="q" id="qtext"></p>
<div id="opts"></div>
<div class="feedback" id="fb"></div>
</section>
<p class="back"><a href="/">← Back to home</a></p>
</main>
<script>
const QUESTIONS = [{"q": "'ആന്റണി മോസസ്' ഏത് സിനിമയിലെ കഥാപാത്രമാണ്?", "options": ["രണം", "മുംബൈ പോലീസ്", "ബ്രദേഴ്‌സ് ഡേ", "എസ്ര"], "answer": 1}, {"q": "C.I.D രാംദാസ് എന്ന ദാസൻ ഏത് വിഷയത്തിലാണ് ഫസ്റ്റ് ക്ലാസ് നേടിയത്?", "options": ["M Sc", "B Com", "M Com", "B Sc"], "answer": 1}, {"q": "\"നിന്റെയൊക്കെ കളി ഈ ______ അല്ലേ നടക്കൂ, ധൈര്യം ഉണ്ടേൽ ഇന്ത്യയിലേക്ക് വാടാ!\"", "options": ["മലപ്പുറത്ത്", "മധ്യപ്രദേശിൽ", "തമിഴ്‌നാട്ടിൽ", "ജപ്പാനിൽ"], "answer": 2}, {"q": "\"ലവൻ ______, നീ പാടുപെടും!\"", "options": ["പാടുന്നു", "ആടുന്നു", "ഓടുന്നു", "ചാടുന്നു"], "answer": 0}, {"q": "\"തീരുമ്പോ തീരുമ്പോ പണി തരാൻ ഞാനെന്താ ______ വന്ന ഭൂതാ?\"", "options": ["പാർലമെന്റീന്ന്", "അമേരിക്കേന്ന്", "കുപ്പീന്ന്", "ടിക് ടോക്കീന്ന്"], "answer": 2}, {"q": "\"യെവാളുതേ ______. അരി - അയിനാണ്!\"", "options": ["ഇക്കരേലു", "അക്കരേലു", "ചക്കരേലു", "മുക്കരേലു"], "answer": 1}, {"q": "പറക്കും തളിക മുതലാളി ഉണ്ണിയുടെ അച്ഛൻ താമരാക്ഷൻപിള്ള മരിച്ചത് എങ്ങനെയാണ്?", "options": ["ആന കുത്തി", "ബസ്സ് ഇടിച്ച്", "അറ്റാക്ക് വന്ന്", "മരിച്ചിട്ടില്ല"], "answer": 1}, {"q": "\"_____ ഇപ്പൊ യുദ്ധം ഒന്നും ഇല്ലേ?\"", "options": ["പുരുഷുവിന്", "രമണന്", "സുഗുണന്", "മേജർ രവിക്ക്"], "answer": 0}, {"q": "ജിംസി അറിയാതെ മഹേഷ് എടുത്ത ജിംസിയുടെ ഫോട്ടോ ഏത് മാസികയുടെ കവർചിത്രമായാണ് അച്ചടിച്ചു വന്നത്?", "options": ["മംഗളം", "മനോരമ", "നാന", "മഞ്ചാടി"], "answer": 3}, {"q": "'പല്ലവി' ഏത് സിനിമയിലെ കഥാപാത്രമാണ്?", "options": ["ടേക്ക് ഓഫ്", "ഉയരെ", "കൂടെ", "വൈറസ്"], "answer": 1}, {"q": "കർണ്ണൻ നെപ്പോളിയൻ എന്നിവരെക്കൂടാതെ ആരാണ് സാം അലക്സിന്റെ ഹീറോ?", "options": ["ഭഗത് സിംഗ്", "ഹർഭജൻ സിങ്", "ഋഷിരാജ് സിങ്", "മൻമോഹൻ സിംഗ്"], "answer": 0}, {"q": "\"ഭവാനി ഒന്നു മനസ്സുവെച്ചാൽ നമുക്കീ _____ ഒരു മണിയറയാക്കാം.\"", "options": ["കപ്പവറ", "നിലവറ", "കലവറ", "കുളിമുറി"], "answer": 2}, {"q": "CID Moosa ലെ മൂ.സ എന്നത് എന്തിന്റെ ചുരുക്കപ്പേരാണ്?", "options": ["മുൻഷി ശശി", "മൂലംകുഴിയിൽ സഹദേവൻ", "മൂലംകുഴിയിൽ സദാനന്ദൻ", "മുണ്ടൂർ സാബു"], "answer": 1}, {"q": "'ഉമേഷ്' ഏത് സിനിമയിലെ കഥാപാത്രമാണ്?", "options": ["ബാംഗ്ലൂർ ഡേയ്‌സ്", "തട്ടത്തിൻ മറയത്ത്", "ലവ് ആക്ഷൻ ഡ്രാമ", "ഒരു വടക്കൻ സെൽഫി"], "answer": 3}, {"q": "തൊരപ്പൻ കൊച്ചുണ്ണി മോഷ്ടിക്കാൻ കയറിയത് ഏത് ഫ്ലാറ്റിൽ ആയിരുന്നു?", "options": ["ഹീര", "സ്കൈലൈൻ", "കെന്റ്", "കോൺഫിഡന്റ്"], "answer": 1}, {"q": "താഴെ കൊടുത്തവയിൽ അൻവർ റഷീദ് ചിത്രം അല്ലാത്തത് തിരഞ്ഞെടുക്കുക...", "options": ["ഉസ്താദ് ഹോട്ടൽ", "അണ്ണൻ തമ്പി", "ആൻമരിയ കലിപ്പിലാണ്", "ഛോട്ടാ മുംബൈ"], "answer": 2}, {"q": "താഴെ കൊടുത്തവയിൽ ജിത്തു ജോസഫ് ചിത്രം അല്ലാത്തത് തിരഞ്ഞെടുക്കുക...", "options": ["ദൃശ്യം", "മെമ്മറീസ്", "ട്രാഫിക്", "ആദി"], "answer": 2}, {"q": "ചേക്കിലെ വിഷുദിനത്തിൽ പിള്ളേച്ചൻ എത്ര ചന്തിയാണ് കണി കണ്ടത്?", "options": ["3", "6", "4", "5"], "answer": 3}, {"q": "താഴെ കൊടുത്തവയിൽ ലാൽ ജോസ് ചിത്രം അല്ലാത്തത് തിരഞ്ഞെടുക്കുക...", "options": ["വലിയപെരുന്നാൾ", "സ്പാനിഷ് മസാല", "ക്ലാസ്സ്മേറ്റ്സ്", "അയാളും ഞാനും തമ്മിൽ"], "answer": 0}, {"q": "\"അപ്പുവേട്ടൻ എന്നെ സ്നേഹിക്കുന്നതിന്റെ ______ ഇരട്ടി ഞാനെന്റെ മൊയ്തീനെ സ്നേഹിക്കുന്നുണ്ട്.\"", "options": ["നൂറ്", "പതിനായിരം", "രണ്ട്", "ആയിരം"], "answer": 3}, {"q": "ഈ ചോദ്യങ്ങൾ ഒക്കെ തയ്യാറാക്കിയത് ആരാണെന്നാണ് പറഞ്ഞത്?", "options": ["Deonnn", "ലുട്ടാപ്പി", "ഡാകിനി", "കുട്ടൂസൻ"], "answer": 0}, {"q": "സാഗർ ഏലിയാസ് ജാക്കിക്ക് പണ്ട് എന്തിന്റെ കച്ചവടം ആയിരുന്നു?", "options": ["മഞ്ചാടിക്കുരു", "മയക്കുമരുന്ന്", "മത്തി", "ബിസ്ക്കറ്റ്"], "answer": 3}, {"q": "പ്യാരി മോഷ്ടിക്കാൻ ശ്രമിച്ച 'ഡെഡ്ബോഡിയുടെ അണ്ടർവെയർ' ഏത് നിറത്തിൽ ഉള്ളതായിരുന്നു?", "options": ["കറുപ്പ്", "പച്ച", "നീല", "ചുവപ്പ്"], "answer": 3}, {"q": "തെക്കോട്ടു തിരിച്ചു വെച്ചാൽ ലക്ഷണക്കേടാണെന്ന് രാമൻകുട്ടിയുടെ മുത്തച്ഛൻ പറയുന്നത് എന്തിനെക്കുറിച്ചാണ്?", "options": ["കുണ്ടി", "കിണ്ടി", "ഉരൽ", "ഉലക്ക"], "answer": 1}, {"q": "'തട്ടത്തിൻ മറയത്ത്' എന്ന സിനിമയുടെ സംഗീത സംവിധായകൻ?", "options": ["ഗോപി സുന്ദർ", "ജെറി അമൽദേവ്", "വിനീത് ശ്രീനിവാസൻ", "ഷാൻ റഹ്മാൻ"], "answer": 3}, {"q": "'നിരുപമ' ഏത് സിനിമയിലെ കഥാപാത്രമാണ്?", "options": ["പ്രതി പൂവൻകോഴി", "ഉദാഹരണം സുജാത", "ഹൗ ഓൾഡ് ആർ യൂ", "ലൂസിഫർ"], "answer": 2}, {"q": "\"തെറി കേട്ടിട്ട് ഇവളുടെ വീട് _______ ഭാഗത്തെവിടെയോ ആണെന്നു തോന്നുന്നു.\"", "options": ["കൊടുങ്ങല്ലൂർ", "തൃശ്ശൂർ", "ആമ്പല്ലൂർ", "മലയാറ്റൂർ"], "answer": 0}, {"q": "'മാത്തൻ' ഏത് സിനിമയിലെ കഥാപാത്രമാണ്?", "options": ["കൂടെ", "മായാനദി", "മറഡോണ", "അനാർക്കലി"], "answer": 1}, {"q": "\"______ ആണ് സാറേ ഇവന്റെ മെയിൻ!'", "options": ["ശക്തി", "വിവരം", "ബുദ്ധി", "അറിവ്"], "answer": 2}, {"q": "\"മധ്യതിരുവിതാംകൂർ ഭരിച്ചിരുന്ന രാജാവാ, പേര് _____.\"", "options": ["ശശി", "മാർത്താണ്ഡവർമ്മ", "സാബു", "സോമൻ"], "answer": 0}, {"q": "'സജിൻ' എന്നത് ഏത് നടന്റെ സിനിമാരംഭകാലത്തെ പേരായിരുന്നു?", "options": ["മമ്മൂട്ടി", "മോഹൻലാൽ", "ദിലീപ്", "സുരേഷ് ഗോപി"], "answer": 0}];
function shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
const QUIZ = shuffle(QUESTIONS.map(q => {
  const opts = q.options.map((text, i) => ({ text, correct: i === q.answer }));
  shuffle(opts);
  return { q: q.q, options: opts.map(o => o.text), answer: opts.findIndex(o => o.correct) };
}));
let idx = 0, score = 0, locked = false, timerId = null, timeLeft = 15;
const qtext = document.getElementById('qtext');
const optsEl = document.getElementById('opts');
const prog = document.getElementById('prog');
const scoreEl = document.getElementById('score');
const barfill = document.getElementById('barfill');
const tsec = document.getElementById('tsec');
const tbarfill = document.getElementById('tbarfill');
const fb = document.getElementById('fb');
const quizEl = document.getElementById('quiz');
function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }
function stageColor(pct) {
  if (pct >= 70) return '#1faa53';
  if (pct >= 40) return '#eab308';
  if (pct >= 10) return '#f97316';
  return '#e53935';
}
function paintTimer() {
  const c = stageColor(timeLeft / 15 * 100);
  tsec.style.color = c;
  tbarfill.style.backgroundColor = c;
}
function startTimer() {
  stopTimer();
  timeLeft = 15;
  tsec.textContent = '15s';
  tbarfill.style.width = '100%';
  paintTimer();
  timerId = setInterval(() => {
    timeLeft--;
    tsec.textContent = timeLeft + 's';
    tbarfill.style.width = (timeLeft / 15 * 100) + '%';
    paintTimer();
    if (timeLeft <= 0) { stopTimer(); onTimeout(); }
  }, 1000);
}
function render() {
  const q = QUIZ[idx];
  locked = false;
  fb.textContent = '';
  fb.className = 'feedback';
  prog.textContent = 'ചോദ്യം ' + (idx + 1) + ' / ' + QUIZ.length;
  scoreEl.textContent = 'സ്കോർ: ' + score;
  barfill.style.width = (idx / QUIZ.length * 100) + '%';
  qtext.textContent = q.q;
  optsEl.innerHTML = '';
  q.options.forEach((op, i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = String.fromCharCode(65 + i) + '. ' + op;
    b.onclick = () => pick(i);
    optsEl.appendChild(b);
  });
  startTimer();
}
function reveal(correctIdx, pickedIdx) {
  const btns = optsEl.querySelectorAll('.opt');
  btns.forEach((b, j) => {
    b.disabled = true;
    if (j === correctIdx) b.classList.add('correct');
    else if (j === pickedIdx) b.classList.add('wrong');
    else b.classList.add('dim');
  });
}
function next() {
  setTimeout(() => {
    idx++;
    if (idx < QUIZ.length) render();
    else showResult();
  }, 1500);
}
function pick(i) {
  if (locked) return;
  locked = true;
  stopTimer();
  const q = QUIZ[idx];
  reveal(q.answer, i);
  if (i === q.answer) {
    score++;
    scoreEl.textContent = 'സ്കോർ: ' + score;
    fb.textContent = 'ശരിയുത്തരം!';
    fb.className = 'feedback ok';
  } else {
    fb.textContent = 'തെറ്റുത്തരം';
    fb.className = 'feedback no';
  }
  next();
}
function onTimeout() {
  if (locked) return;
  locked = true;
  const q = QUIZ[idx];
  reveal(q.answer, -1);
  fb.textContent = 'സമയം കഴിഞ്ഞു! ശരിയുത്തരം പച്ചയിൽ കാണാം';
  fb.className = 'feedback no';
  next();
}
function showResult() {
  stopTimer();
  barfill.style.width = '100%';
  let msg = 'വീണ്ടും ശ്രമിക്കൂ!';
  if (score === QUIZ.length) msg = 'Perfect! എല്ലാം ശരി!';
  else if (score >= 22) msg = 'മികച്ചത്!';
  else if (score >= 12) msg = 'നല്ല ശ്രമം!';
  quizEl.innerHTML = '<div class="result"><p>ക്വിസ് കഴിഞ്ഞു!</p><div class="big">' + score + ' / ' + QUIZ.length + '</div><p>' + msg + '</p><button class="btn" onclick="location.reload()">വീണ്ടും കളിക്കുക</button></div>';
}
render();
</script>
</body>
</html>
